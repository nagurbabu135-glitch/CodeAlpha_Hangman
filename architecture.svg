<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="mockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dashFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }
    
    .animated-line {
      stroke-dasharray: 8, 8;
      animation: dashFlow 1.2s linear infinite;
    }
    .reverse-animated-line {
      stroke-dasharray: 8, 8;
      animation: dashFlow 1.2s linear infinite reverse;
    }
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .text-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #f8fafc; }
    .text-subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 13px; }
    .text-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #cbd5e1; font-size: 12px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 10px; fill: #ffffff; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="640" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="638" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Grid Background Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,80 L 1000,80 M 0,160 L 1000,160 M 0,240 L 1000,240 M 0,320 L 1000,320 M 0,400 L 1000,400 M 0,480 L 1000,480 M 0,560 L 1000,560"/>
    <path d="M 100,0 L 100,640 M 200,0 L 200,640 M 300,0 L 300,640 M 400,0 L 400,640 M 500,0 L 500,640 M 600,0 L 600,640 M 700,0 L 700,640 M 800,0 L 800,640 M 900,0 L 900,640"/>
  </g>

  <!-- Header Banner -->
  <text x="500" y="45" text-anchor="middle" class="text-title" font-size="22" letter-spacing="1">HANGMAN GAME - SYSTEM ARCHITECTURE</text>
  <text x="500" y="68" text-anchor="middle" class="text-subtitle">Real-Time Data Pipeline • Resilient AI Hint Fallback • Hybrid Micro-Engine</text>

  <!-- ================= CONNECTION PATHS WITH ANIMATIONS ================= -->
  
  <!-- Path 1: Client <-> Server (Cyan) -->
  <path id="pathClientServer" d="M 280,260 L 380,260" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 280,260 L 380,260" stroke="#38bdf8" stroke-width="3" fill="none" class="animated-line" filter="url(#glowCyan)"/>

  <!-- Path 2: Server <-> OpenAI (Green) -->
  <path id="pathServerAI" d="M 620,200 C 660,200 660,140 700,140" stroke="#4ade80" stroke-width="3" fill="none"/>
  <path d="M 620,200 C 660,200 660,140 700,140" stroke="#4ade80" stroke-width="3" fill="none" class="animated-line" filter="url(#glowGreen)"/>

  <!-- Path 3: Server <-> MongoDB (Orange) -->
  <path id="pathServerMongo" d="M 620,260 L 700,260" stroke="#fb923c" stroke-width="3" fill="none"/>
  <path d="M 620,260 L 700,260" stroke="#fb923c" stroke-width="3" fill="none" class="animated-line" filter="url(#glowOrange)"/>

  <!-- Path 4: Server <-> MockDB (Purple Fallback) -->
  <path id="pathServerMock" d="M 620,320 C 660,320 660,420 700,420" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
  <path d="M 620,320 C 660,320 660,420 700,420" stroke="#c084fc" stroke-width="3" fill="none" class="reverse-animated-line" filter="url(#glowPurple)"/>

  <!-- ANIMATED PACKET PULSES ALONG PATHS -->
  <circle r="5" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 280,260 L 380,260"/>
  </circle>
  <circle r="4" fill="#ffffff">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 280,260 L 380,260"/>
  </circle>

  <circle r="5" fill="#4ade80" filter="url(#glowGreen)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 620,200 C 660,200 660,140 700,140"/>
  </circle>

  <circle r="5" fill="#fb923c" filter="url(#glowOrange)">
    <animateMotion dur="2.0s" repeatCount="indefinite" path="M 620,260 L 700,260"/>
  </circle>

  <circle r="5" fill="#c084fc" filter="url(#glowPurple)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 620,320 C 660,320 660,420 700,420"/>
  </circle>


  <!-- ================= TIER 1: CLIENT PRESENTATION (LEFT) ================= -->
  <g transform="translate(40, 110)">
    <rect width="240" height="420" rx="14" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="238" height="418" x="1" y="1" rx="13" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="100" height="22" rx="6" fill="#0284c7"/>
    <text x="66" y="31" text-anchor="middle" class="badge-text">FRONTEND SPA</text>
    
    <text x="16" y="62" class="text-title" font-size="17">React 18 Engine</text>
    <text x="16" y="82" class="text-subtitle">Client Presentation Layer</text>

    <!-- Sub-components -->
    <!-- Component 1 -->
    <g transform="translate(16, 100)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#38bdf8">Interactive UI Components</text>
      <text x="12" y="44" class="text-body">• Animated SVG Hangman Canvas</text>
    </g>

    <!-- Component 2 -->
    <g transform="translate(16, 172)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#38bdf8">Dual Input Controllers</text>
      <text x="12" y="44" class="text-body">• Virtual Keyboard &amp; Keydown Listener</text>
    </g>

    <!-- Component 3 -->
    <g transform="translate(16, 244)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#38bdf8">Axios HTTP Client</text>
      <text x="12" y="44" class="text-body">• Automatic Bearer Token Header</text>
    </g>

    <!-- Component 4 -->
    <g transform="translate(16, 316)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#38bdf8">Client State &amp; Storage</text>
      <text x="12" y="44" class="text-body">• JWT Storage &amp; Session Resilience</text>
    </g>
  </g>


  <!-- ================= TIER 2: EXPRESS API GATEWAY (MIDDLE) ================= -->
  <g transform="translate(380, 110)">
    <rect width="240" height="420" rx="14" fill="url(#serverGrad)" stroke="#818cf8" stroke-width="2"/>
    <rect width="238" height="418" x="1" y="1" rx="13" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="110" height="22" rx="6" fill="#4f46e5"/>
    <text x="71" y="31" text-anchor="middle" class="badge-text">EXPRESS SERVER</text>
    
    <text x="16" y="62" class="text-title" font-size="17">Node.js API Gateway</text>
    <text x="16" y="82" class="text-subtitle">Serverless &amp; Standalone</text>

    <!-- Sub-components -->
    <g transform="translate(16, 100)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#818cf8">JWT Authentication Guard</text>
      <text x="12" y="44" class="text-body">• Stateless Session Verification</text>
    </g>

    <g transform="translate(16, 172)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#818cf8">Game Logic Controller</text>
      <text x="12" y="44" class="text-body">• Word Evaluation &amp; Life Tracking</text>
    </g>

    <g transform="translate(16, 244)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#818cf8">AI Hint Dispatcher</text>
      <text x="12" y="44" class="text-body">• OpenAI Request / Local Fallback</text>
    </g>

    <g transform="translate(16, 316)">
      <rect width="208" height="60" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
      <text x="12" y="24" class="text-title" font-size="13" fill="#818cf8">DB Health Sentinel</text>
      <text x="12" y="44" class="text-body">• Dynamic Mongo / Mock Router</text>
    </g>
  </g>


  <!-- ================= TIER 3: SERVICES & DATA (RIGHT) ================= -->
  
  <!-- Node A: OpenAI Service -->
  <g transform="translate(700, 80)">
    <rect width="260" height="120" rx="14" fill="url(#aiGrad)" stroke="#4ade80" stroke-width="2"/>
    <rect x="16" y="16" width="110" height="22" rx="6" fill="#059669"/>
    <text x="71" y="31" text-anchor="middle" class="badge-text">EXTERNAL SERVICE</text>
    <text x="16" y="60" class="text-title" font-size="16" fill="#4ade80">OpenAI GPT-3.5 API</text>
    <text x="16" y="80" class="text-body">• Intelligent Non-Revealing Hints</text>
    <text x="16" y="98" class="text-body">• Async Prompt Context Pipeline</text>

    <!-- Pulse Status Light -->
    <circle cx="236" cy="26" r="5" fill="#4ade80" filter="url(#glowGreen)"/>
    <circle cx="236" cy="26" r="8" fill="none" stroke="#4ade80" stroke-width="1.5">
      <animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node B: Primary MongoDB -->
  <g transform="translate(700, 225)">
    <rect width="260" height="120" rx="14" fill="url(#dbGrad)" stroke="#fb923c" stroke-width="2"/>
    <rect x="16" y="16" width="120" height="22" rx="6" fill="#c2410c"/>
    <text x="76" y="31" text-anchor="middle" class="badge-text">PRIMARY STORAGE</text>
    <text x="16" y="60" class="text-title" font-size="16" fill="#fb923c">MongoDB Atlas / Local</text>
    <text x="16" y="80" class="text-body">• User Profiles &amp; Hashed Passwords</text>
    <text x="16" y="98" class="text-body">• Game History &amp; Lifetime Win Stats</text>

    <!-- Pulse Status Light -->
    <circle cx="236" cy="26" r="5" fill="#fb923c" filter="url(#glowOrange)"/>
    <circle cx="236" cy="26" r="8" fill="none" stroke="#fb923c" stroke-width="1.5">
      <animate attributeName="r" values="4;12" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node C: Fallback In-Memory MockDB -->
  <g transform="translate(700, 370)">
    <rect width="260" height="120" rx="14" fill="url(#mockGrad)" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="16" y="16" width="130" height="22" rx="6" fill="#7e22ce"/>
    <text x="81" y="31" text-anchor="middle" class="badge-text">FALLBACK DEMO MODE</text>
    <text x="16" y="60" class="text-title" font-size="16" fill="#c084fc">In-Memory MockDB</text>
    <text x="16" y="80" class="text-body">• Active when MONGODB_URI missing</text>
    <text x="16" y="98" class="text-body">• Zero-Config Instant Execution</text>

    <!-- Pulse Status Light -->
    <circle cx="236" cy="26" r="5" fill="#c084fc" filter="url(#glowPurple)"/>
    <circle cx="236" cy="26" r="8" fill="none" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="r" values="4;12" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(500, 595)">
    <text x="0" y="0" text-anchor="middle" class="text-subtitle" font-size="12">
      <tspan fill="#38bdf8">● REST HTTP Flow</tspan>  │  
      <tspan fill="#4ade80">● OpenAI API Pipeline</tspan>  │  
      <tspan fill="#fb923c">● MongoDB Database</tspan>  │  
      <tspan fill="#c084fc">● MockDB Fallback</tspan>
    </text>
  </g>
</svg>
