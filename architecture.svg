<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dashFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.03); }
    }
    @keyframes beaconPulse {
      0% { r: 3px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    .animated-line {
      stroke-dasharray: 8, 8;
      animation: dashFlow 1.2s linear infinite;
    }
    .animated-line-fast {
      stroke-dasharray: 8, 8;
      animation: dashFlow 0.8s linear infinite;
    }
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .float-item {
      animation: floatParticle 4s ease-in-out infinite;
    }
    
    .text-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
    .text-subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #94a3b8; font-size: 13px; }
    .text-header { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; }
    .text-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #cbd5e1; font-size: 12px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #ffffff; }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="660" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="658" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7"/>

  <!-- Subtly Animated Background Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,80 L 1000,80 M 0,160 L 1000,160 M 0,240 L 1000,240 M 0,320 L 1000,320 M 0,400 L 1000,400 M 0,480 L 1000,480 M 0,560 L 1000,560"/>
    <path d="M 100,0 L 100,660 M 200,0 L 200,660 M 300,0 L 300,660 M 400,0 L 400,660 M 500,0 L 500,660 M 600,0 L 600,660 M 700,0 L 700,660 M 800,0 L 800,660 M 900,0 L 900,660"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(0, 10)">
    <text x="500" y="42" text-anchor="middle" class="text-title" font-size="22" letter-spacing="1.5">HANGMAN PRO — SYSTEM ARCHITECTURE</text>
    <text x="500" y="62" text-anchor="middle" class="text-subtitle">Enterprise Python REST Backend • MongoDB Persistence • HTML5 Canvas &amp; Audio Engine</text>
  </g>

  <!-- ==================== CONNECTOR LINES ==================== -->
  
  <!-- Client to Backend Connection Line -->
  <g>
    <path d="M 330,220 L 390,220" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <path d="M 330,220 L 390,220" stroke="#38bdf8" stroke-width="3" fill="none" class="animated-line"/>
    <!-- Animated Data Flow Pulses -->
    <circle cx="360" cy="220" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
    
    <!-- Connection Label -->
    <rect x="332" y="195" width="56" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="360" y="207" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">REST API</text>
  </g>

  <!-- Backend to Database Connection Line -->
  <g>
    <path d="M 670,220 L 730,220" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M 670,220 L 730,220" stroke="#10b981" stroke-width="3" fill="none" class="animated-line-fast"/>
    <!-- Animated Data Flow Pulses -->
    <circle cx="700" cy="220" r="4" fill="#10b981" filter="url(#glowGreen)"/>
    
    <!-- Connection Label -->
    <rect x="672" y="195" width="56" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="700" y="207" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#10b981">PyMongo</text>
  </g>

  <!-- JWT Token Authorization Loop Back Line -->
  <g>
    <path d="M 530,340 C 530,420 200,420 200,340" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6" fill="none"/>
    <path d="M 530,340 C 530,420 200,420 200,340" stroke="#c084fc" stroke-width="2" fill="none" class="animated-line"/>
    <rect x="315" y="410" width="100" height="20" rx="10" fill="#1e1b4b" stroke="#c084fc" stroke-width="1"/>
    <text x="365" y="424" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#c084fc">🔐 JWT Bearer Header</text>
  </g>


  <!-- ==================== TIER 1: CLIENT LAYER (SPA) ==================== -->
  <g transform="translate(40, 100)">
    <!-- Container Box -->
    <rect width="290" height="490" rx="14" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <rect width="290" height="490" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" filter="url(#glowCyan)"/>

    <!-- Header Badge -->
    <rect x="16" y="16" width="258" height="34" rx="8" fill="#0369a1" opacity="0.8"/>
    <text x="145" y="38" text-anchor="middle" class="text-header" fill="#e0f2fe">💻 CLIENT TIER (Browser SPA)</text>

    <!-- Sub-Component 1: HTML5 Canvas Physics Engine -->
    <g transform="translate(16, 66)">
      <rect width="258" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <circle cx="25" cy="25" r="10" fill="#0284c7" opacity="0.3"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🎨</text>
      <text x="45" y="26" class="text-header" fill="#7dd3fc" font-size="13">HTML5 Canvas Engine</text>
      <text x="45" y="44" class="text-body">• Pendulum Rope Physics</text>
      <text x="45" y="60" class="text-body">• 6-Stage Ragdoll Character</text>
      <text x="45" y="76" class="text-body">• Particle FX &amp; Trapdoor Drop</text>
    </g>

    <!-- Sub-Component 2: Glassmorphism UI System -->
    <g transform="translate(16, 171)">
      <rect width="258" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">✨</text>
      <text x="45" y="26" class="text-header" fill="#7dd3fc" font-size="13">Glassmorphism UI System</text>
      <text x="45" y="44" class="text-body">• Dark Mode CSS3 Architecture</text>
      <text x="45" y="60" class="text-body">• Virtual On-Screen Keyboard</text>
      <text x="45" y="76" class="text-body">• Real-Time Password Meter</text>
    </g>

    <!-- Sub-Component 3: Web Audio FX Synthesizer -->
    <g transform="translate(16, 276)">
      <rect width="258" height="90" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🔊</text>
      <text x="45" y="26" class="text-header" fill="#7dd3fc" font-size="13">Web Audio Synthesizer</text>
      <text x="45" y="44" class="text-body">• Zero-Dependency Audio Synthesis</text>
      <text x="45" y="60" class="text-body">• Key Clicks, Chimes &amp; Thuds</text>
      <text x="45" y="76" class="text-body">• Fanfare &amp; Execution Drop SFX</text>
    </g>

    <!-- Sub-Component 4: JWT Session Manager -->
    <g transform="translate(16, 376)">
      <rect width="258" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🔐</text>
      <text x="45" y="26" class="text-header" fill="#7dd3fc" font-size="13">Session Auth Controller</text>
      <text x="45" y="44" class="text-body">• JWT Storage (`localStorage`)</text>
      <text x="45" y="60" class="text-body">• Automatic Bearer Header Injection</text>
      <text x="45" y="76" class="text-body">• Masked Word State Synchronization</text>
    </g>
  </g>


  <!-- ==================== TIER 2: BACKEND SERVER LAYER ==================== -->
  <g transform="translate(380, 100)">
    <!-- Container Box -->
    <rect width="290" height="490" rx="14" fill="url(#serverGrad)" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
    <rect width="290" height="490" rx="14" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3" filter="url(#glowPurple)"/>

    <!-- Header Badge -->
    <rect x="16" y="16" width="258" height="34" rx="8" fill="#6b21a8" opacity="0.8"/>
    <text x="145" y="38" text-anchor="middle" class="text-header" fill="#f3e8ff">⚙️ BACKEND TIER (Python REST)</text>

    <!-- Sub-Component 1: Flask Web Application -->
    <g transform="translate(16, 66)">
      <rect width="258" height="95" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🐍</text>
      <text x="45" y="26" class="text-header" fill="#d8b4fe" font-size="13">Flask REST Framework</text>
      <text x="45" y="44" class="text-body">• `app.py` Modular Route Handlers</text>
      <text x="45" y="60" class="text-body">• Flask-CORS Middleware</text>
      <text x="45" y="76" class="text-body">• Static Single-Page File Server</text>
    </g>

    <!-- Sub-Component 2: JWT & Bcrypt Auth Security -->
    <g transform="translate(16, 171)">
      <rect width="258" height="95" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🛡️</text>
      <text x="45" y="26" class="text-header" fill="#d8b4fe" font-size="13">Security &amp; Auth Core</text>
      <text x="45" y="44" class="text-body">• PyJWT Token Generation &amp; Verification</text>
      <text x="45" y="60" class="text-body">• Bcrypt Salted Password Hashing</text>
      <text x="45" y="76" class="text-body">• `@token_required` Wrapper Middleware</text>
    </g>

    <!-- Sub-Component 3: Server Anti-Cheat Game Engine -->
    <g transform="translate(16, 276)">
      <rect width="258" height="90" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">🎯</text>
      <text x="45" y="26" class="text-header" fill="#d8b4fe" font-size="13">Anti-Cheat Game Engine</text>
      <text x="45" y="44" class="text-body">• Secret Words Kept strictly Server-Side</text>
      <text x="45" y="60" class="text-body">• Dynamic Masking (`_ A _ A _ _`)</text>
      <text x="45" y="76" class="text-body">• Multi-Difficulty Rules (5/6/8 Attempts)</text>
    </g>

    <!-- Sub-Component 4: Leaderboard & Analytics Engine -->
    <g transform="translate(16, 376)">
      <rect width="258" height="95" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="25" y="29" text-anchor="middle" font-size="12">📊</text>
      <text x="45" y="26" class="text-header" fill="#d8b4fe" font-size="13">Analytics &amp; Scoring</text>
      <text x="45" y="44" class="text-body">• Real-Time High Score Calculations</text>
      <text x="45" y="60" class="text-body">• Win Rate &amp; Streak Tracking</text>
      <text x="45" y="76" class="text-body">• Global Top 10 Leaderboard Router</text>
    </g>
  </g>


  <!-- ==================== TIER 3: DATABASE LAYER (MONGODB) ==================== -->
  <g transform="translate(720, 100)">
    <!-- Container Box -->
    <rect width="240" height="490" rx="14" fill="url(#dbGrad)" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <rect width="240" height="490" rx="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" filter="url(#glowGreen)"/>

    <!-- Header Badge -->
    <rect x="16" y="16" width="208" height="34" rx="8" fill="#047857" opacity="0.8"/>
    <text x="120" y="38" text-anchor="middle" class="text-header" fill="#d1fae5">🍃 DATABASE (MongoDB)</text>

    <!-- Collection 1: Users Collection -->
    <g transform="translate(16, 66)">
      <rect width="208" height="95" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="20" y="29" text-anchor="middle" font-size="12">👤</text>
      <text x="38" y="26" class="text-header" fill="#6ee7b7" font-size="13">`users` Collection</text>
      <text x="38" y="44" class="text-body">• Username (Unique Index)</text>
      <text x="38" y="60" class="text-body">• Bcrypt Password Hash</text>
      <text x="38" y="76" class="text-body">• User Stats (Wins, Streak)</text>
    </g>

    <!-- Collection 2: Words Collection -->
    <g transform="translate(16, 171)">
      <rect width="208" height="95" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="20" y="29" text-anchor="middle" font-size="12">📚</text>
      <text x="38" y="26" class="text-header" fill="#6ee7b7" font-size="13">`words` Collection</text>
      <text x="38" y="44" class="text-body">• 6 Word Categories</text>
      <text x="38" y="60" class="text-body">• Hints &amp; Difficulty Tiers</text>
      <text x="38" y="76" class="text-body">• Auto-Seeded via `seed_words`</text>
    </g>

    <!-- Collection 3: Games History Collection -->
    <g transform="translate(16, 276)">
      <rect width="208" height="90" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="20" y="29" text-anchor="middle" font-size="12">🎮</text>
      <text x="38" y="26" class="text-header" fill="#6ee7b7" font-size="13">`games` Collection</text>
      <text x="38" y="44" class="text-body">• Active Game Sessions</text>
      <text x="38" y="60" class="text-body">• Guesses &amp; Attempts Left</text>
      <text x="38" y="76" class="text-body">• Match History Audit Log</text>
    </g>

    <!-- Collection 4: Leaderboard Collection -->
    <g transform="translate(16, 376)">
      <rect width="208" height="95" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="20" y="29" text-anchor="middle" font-size="12">🏆</text>
      <text x="38" y="26" class="text-header" fill="#6ee7b7" font-size="13">`leaderboard` Collection</text>
      <text x="38" y="44" class="text-body">• High Score Rankings</text>
      <text x="38" y="60" class="text-body">• Win Rate Percentage</text>
      <text x="38" y="76" class="text-body">• Fast Indexed Query Sorting</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(0, 610)">
    <rect width="1000" height="50" rx="0" fill="#0f172a" opacity="0.8"/>
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="500" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      ⚡ Decoupled 3-Tier Web Architecture • Real-Time Physics • REST API Security • Persistent Storage
    </text>
  </g>
</svg>
